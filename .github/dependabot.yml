version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Patchright follows Chromium closely: keep it in its own PR so a browser bump is easy to spot.
      patchright:
        patterns: [patchright]
      dependencies:
        patterns: ["*"]
        exclude-patterns: [patchright]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
