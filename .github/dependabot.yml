version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Patchright follows Chromium closely: keep it in its own PR so a browser bump is easy to spot.
      patchright:
        patterns: [patchright]
      dependencies:
        patterns: ["*"]
        exclude-patterns: [patchright]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The image stays on the Node LTS line it was tested with; move majors by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
